<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jin's Perfumery Library</title>
    <meta name="description" content="Jin's perfumery raw materials: CAS numbers, prices, IFRA limits, and what 255 published formulas do with each one." />
    <meta name="theme-color" content="#0c0b09" />
    <script>
      // Apply a saved light/dark choice before the page draws (see ThemeToggle.tsx).
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
